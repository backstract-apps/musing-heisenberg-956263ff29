metadata:
  name: musing-heisenberg-956263ff29-bst-token
  namespace: apps-release
  labels:
    app: musing-heisenberg-956263ff29
    managed-by: backstract
  annotations:
    backstract.io/token-scope: "storage.*,cache.*"
type: Opaque
stringData:
  token: "PLACEHOLDER_BST_TOKEN_REPLACE_AT_RUNTIME"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: musing-heisenberg-956263ff29-depl
  namespace: apps-release
  labels:
    app: musing-heisenberg-956263ff29
    release: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: musing-heisenberg-956263ff29
      release: prometheus
  template:
    metadata:
      labels:
        app: musing-heisenberg-956263ff29
        release: prometheus
    spec:
      #runtimeClassName: gvisor
      #imagePullSecrets:
        #- name: aws-ecr-creds
      serviceAccountName: alloy-service-account
      volumes:
        - name: alloy-config
          configMap:
            name: alloy-configmap-musing-heisenberg-956263ff29
            items:
              - key: alloy.river
                path: config.alloy
        - name: podinfo
          downwardAPI:
            items:
              - path: "labels"
                fieldRef:
                  fieldPath: metadata.labels
              - path: "annotations"
                fieldRef:
                  fieldPath: metadata.annotations
      containers:
        - name: musing-heisenberg-956263ff29
          image: asia-south2-docker.pkg.dev/platform-test-487912/backstract-apps/backstract_apps:musing-heisenberg-956263ff29
          imagePullPolicy: Always
          env:
            - name: BACKSTRACT_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
