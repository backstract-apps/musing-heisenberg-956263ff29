            - secretRef:
                name: app-secrets-coll-37552dbc44b945fb8d0eaf74197a9542
            - secretRef:
                name: app-resources-secrets-coll-37552dbc44b945fb8d0eaf74197a9542
                optional: true
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8080
              name: metrics
          resources:
            requests:
              memory: "250Mi"
              cpu: "50m"
            limits:
              memory: "250Mi"
              cpu: "1"
        - name: alloy-sidecar
          image: grafana/alloy:latest
          args:
            - "run"
            - "/etc/alloy/config.alloy"
            - "--server.http.listen-addr=0.0.0.0:12345"
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: alloy-http
              containerPort: 12345
              protocol: TCP
          volumeMounts:
            - name: alloy-config
              mountPath: /etc/alloy
            - name: podinfo
              mountPath: /etc/podinfo
              readOnly: true
          resources:
            requests:
              memory: "50Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "100m"
